<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Cromo - Projetos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&display=swap');

    :root {
      --black: #000000;
      --white: #FFFFFF;
      --gray: #888888;
      --light-gray: #BBBBBB;
      --border: rgba(0,0,0,0.08);
      --font: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 935px;
      margin: 0 auto;
      padding: 0 16px 5rem;
    }

    .profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4rem;
      padding: 6vh 0 5vh;
    }

    .profile-logo {
      max-width: 140px;
      height: auto;
      flex-shrink: 0;
    }

    .profile-info {
      text-align: left;
    }

    .profile-stats {
      display: flex;
      gap: 3rem;
      margin-bottom: 1rem;
    }

    .profile-stats span {
      font-size: 0.95rem;
    }

    .profile-stats strong {
      font-weight: 700;
      font-size: 1.4rem;
      display: block;
      margin-bottom: 0.15rem;
      letter-spacing: -1px;
      font-style: italic;
    }

    .profile-bio {
      font-size: 0.85rem;
      line-height: 1.5;
      max-width: 500px;
    }

    .profile-bio .bold {
      font-weight: 600;
    }

    .feed-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 3px 0;
      margin-top: 2rem;
    }

    .feed-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }

    .feed-item.hidden {
      display: none;
    }

    .feed-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .feed-item-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .feed-item:hover .feed-item-overlay {
      opacity: 1;
    }

    .feed-item-overlay span {
      color: var(--white);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-align: center;
      padding: 1rem;
    }

    .load-more {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 0;
    }

    .load-more-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--light-gray);
      background: none;
      font-size: 1.1rem;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      color: var(--light-gray);
      font-family: var(--font);
    }

    .load-more-btn:hover {
      border-color: var(--black);
      color: var(--black);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--gray);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 400;
      padding: 3rem 0 0;
      transition: color 0.2s;
      letter-spacing: 0.5px;
    }

    .back-link:hover {
      color: var(--black);
    }

    @media (max-width: 640px) {
      .profile {
        flex-direction: column;
        text-align: center;
        gap: 2rem;
        padding: 4vh 0 3vh;
      }
      .profile-info {
        text-align: center;
      }
      .profile-stats {
        justify-content: center;
      }
      .profile-logo {
        max-width: 80px;
      }
      .feed-grid {
        gap: 2px;
        padding: 2px 0;
      }
      .feed-item.hidden {
        display: block;
      }
      .load-more {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <a href="index.html" class="back-link">&larr; Voltar</a>

    <div class="profile">
      <img src="images/logo-acervo.avif" alt="Cromo" class="profile-logo">
      <div class="profile-info">
        <div class="profile-stats">
          <span><strong>12</strong> projetos</span>
          <span><strong>300+</strong> clientes</span>
          <span><strong>6</strong> anos</span>
        </div>
        <div class="profile-bio">
          <span class="bold">Studio Cromo</span> - Fotografia, vídeo e estratégia digital.<br>
          Comunicação visual para hotelaria, gastronomia &amp; lifestyle de luxo.
        </div>
      </div>
    </div>

    <div class="feed-grid">

      <a href="projeto-atelier-dos-sabores.html" class="feed-item">
        <img src="design-system/images/GASTRONOMIA/ATELIER DOS SABORES/Cópia de RBC02912.avif" alt="Atelier dos Sabores" loading="lazy">
        <div class="feed-item-overlay"><span>Atelier dos Sabores</span></div>
      </a>

      <a href="projeto-bam-bam.html" class="feed-item">
        <img src="design-system/images/GASTRONOMIA/BAM BAM/Cópia de DSCF1336.avif" alt="Bam Bam" loading="lazy">
        <div class="feed-item-overlay"><span>Bam Bam</span></div>
      </a>

      <a href="projeto-bar-do-ze.html" class="feed-item">
        <img src="design-system/images/GASTRONOMIA/BAR DO ZÉ/Cópia de RB108551.avif" alt="Bar do Zé" loading="lazy">
        <div class="feed-item-overlay"><span>Bar do Zé</span></div>
      </a>

      <a href="projeto-empadinhas.html" class="feed-item">
        <img src="design-system/images/GASTRONOMIA/empadinhas/Cópia de RBC00345-Editar.avif" alt="Empadinhas" loading="lazy">
        <div class="feed-item-overlay"><span>Empadinhas</span></div>
      </a>

      <a href="projeto-esplanada.html" class="feed-item">
        <img src="design-system/images/GASTRONOMIA/ESPLANADA/Cópia de RBC01256.avif" alt="Esplanada" loading="lazy">
        <div class="feed-item-overlay"><span>Esplanada</span></div>
      </a>

      <a href="projeto-kitchin.html" class="feed-item">
        <img src="design-system/images/GASTRONOMIA/KITCHIN/Cópia de RBC02269.avif" alt="Kitchin" loading="lazy">
        <div class="feed-item-overlay"><span>Kitchin</span></div>
      </a>

      <a href="projeto-la-gare.html" class="feed-item hidden">
        <img src="design-system/images/GASTRONOMIA/LA GARE/Cópia de Cópia de Spaghetti ao pomodoro.avif" alt="La Gare" loading="lazy">
        <div class="feed-item-overlay"><span>La Gare</span></div>
      </a>

      <a href="projeto-loire-bistro.html" class="feed-item hidden">
        <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01749.avif" alt="Loire Bistro" loading="lazy">
        <div class="feed-item-overlay"><span>Loire Bistro</span></div>
      </a>

      <a href="projeto-macaw.html" class="feed-item hidden">
        <img src="design-system/images/GASTRONOMIA/macaw/Cópia de RBC01142.avif" alt="Macaw" loading="lazy">
        <div class="feed-item-overlay"><span>Macaw</span></div>
      </a>

      <a href="projeto-mamma-gorda.html" class="feed-item hidden">
        <img src="design-system/images/GASTRONOMIA/MAMMA GORDA/Cópia de RBC03940.avif" alt="Mamma Gorda" loading="lazy">
        <div class="feed-item-overlay"><span>Mamma Gorda</span></div>
      </a>

      <a href="projeto-abracadabra.html" class="feed-item hidden">
        <img src="design-system/images/HOTEL/ABRACADABRA/Cópia de DJI_0179-Editar.avif" alt="Abracadabra" loading="lazy">
        <div class="feed-item-overlay"><span>Abracadabra</span></div>
      </a>

      <a href="projeto-zendaya.html" class="feed-item hidden">
        <img src="design-system/images/HOTEL/ZENDAYA/Cópia de Cópia de CR_00001-Enhanced-NR.avif" alt="Zendaya" loading="lazy">
        <div class="feed-item-overlay"><span>Zendaya</span></div>
      </a>

    </div>

    <div class="load-more">
      <button class="load-more-btn" onclick="mostrarMais()">+</button>
    </div>

  </div>

  <script>
    function mostrarMais() {
      document.querySelectorAll('.feed-item.hidden').forEach(el => el.classList.remove('hidden'));
      document.querySelector('.load-more').style.display = 'none';
    }
  </script>

</body>
</html>
