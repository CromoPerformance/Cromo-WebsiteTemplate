<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Cromo - Loire Bistro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }
    :root {
      --black: #000;
      --white: #fff;
      --gray: #888;
      --light-gray: #f5f5f5;
      --border: rgba(0,0,0,0.08);
    }
    img { display: block; }

    .hero {
      position: relative;
      width: 100%;
      height: 75vh;
      min-height: 450px;
      overflow: hidden;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-content {
      padding: 3rem 2rem 3.5rem;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
    }
    .hero-left {
      display: flex;
      flex-direction: column;
    }
    .hero-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--gray);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 400;
      margin-bottom: 1rem;
      transition: color 0.2s;
    }
    .hero-back:hover { color: var(--black); }
    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -2px;
      color: var(--black);
    }
    .hero-meta {
      display: flex;
      gap: 2rem;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--gray);
    }
    .hero-meta span { text-transform: uppercase; }

    .gallery {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }
    .gallery-row {
      display: grid;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .gallery-row.two-eq { grid-template-columns: 1fr 1fr; }
    .gallery-row.two-wide-left { grid-template-columns: 2fr 1fr; }
    .gallery-row.two-wide-right { grid-template-columns: 1fr 2fr; }
    .gallery-row.full { grid-template-columns: 1fr; }
    .gallery-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .gallery-row.three-wide-center { grid-template-columns: 1fr 2fr 1fr; }
    .gallery-row.three-wide-left { grid-template-columns: 2fr 1fr 1fr; }
    .gallery-row.three-wide-right { grid-template-columns: 1fr 1fr 2fr; }
    .gallery-row .empty { pointer-events: none; }
    .gallery-row img {
      width: 100%;
      display: block;
    }
    .gallery-row .img-h { aspect-ratio: 16 / 9; object-fit: cover; }
    .gallery-row .img-v { aspect-ratio: 3 / 4; object-fit: cover; }
    .gallery-row .img-sq { aspect-ratio: 1 / 1; object-fit: cover; }
    .gallery-row .img-tall { aspect-ratio: 4 / 5; object-fit: cover; }

    .next-proj {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
      border-top: 1px solid var(--border);
      text-decoration: none;
      color: var(--black);
      transition: opacity 0.2s;
    }
    .next-proj:hover { opacity: 0.6; }
    .next-label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--gray);
      text-transform: uppercase;
    }
    .next-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .hero { height: 50vh; min-height: 300px; }
      .hero-content { padding: 2rem 1rem; }
      .gallery { padding: 2rem 1rem; }
      .gallery-row { gap: 0.3rem; margin-bottom: 0.3rem; }
      .gallery-row.two-wide-left,
      .gallery-row.two-wide-right { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01749.avif" alt="Loire Bistro">
  </section>

  <div class="hero-content">
    <div class="hero-left">
      <a href="feed.html" class="hero-back">&larr; Acervo</a>
      <h1 class="hero-title">Loire Bistro</h1>
    </div>
    <div class="hero-meta">
      <span>Gastronomia</span>
      <span>Fotografia</span>
      <span>2024</span>
    </div>
  </div>

  <div class="gallery">
    <div class="gallery-row full">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01727.avif" alt="Loire Bistro" class="img-h">
    </div>
    <div class="gallery-row two-wide-left">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01757.avif" alt="Loire Bistro" class="img-tall">
      <div class="empty"></div>
    </div>
    <div class="gallery-row three">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01772.avif" alt="Loire Bistro" class="img-sq">
      <div class="empty"></div>
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01885-Editar.avif" alt="Loire Bistro" class="img-sq">
    </div>
    <div class="gallery-row two-wide-right">
      <div class="empty"></div>
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01903.avif" alt="Loire Bistro" class="img-v">
    </div>
    <div class="gallery-row two-eq">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01913-Editar.avif" alt="Loire Bistro" class="img-v">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01921.avif" alt="Loire Bistro" class="img-v">
    </div>
    <div class="gallery-row three-wide-center">
      <div class="empty"></div>
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01930.avif" alt="Loire Bistro" class="img-sq">
      <div class="empty"></div>
    </div>
    <div class="gallery-row full">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01935.avif" alt="Loire Bistro" class="img-h">
    </div>
    <div class="gallery-row three">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC02016-Editar.avif" alt="Loire Bistro" class="img-sq">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC02033.avif" alt="Loire Bistro" class="img-sq">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC02084.avif" alt="Loire Bistro" class="img-sq">
    </div>
    <div class="gallery-row three-wide-right">
      <div class="empty"></div>
      <div class="empty"></div>
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC02143.avif" alt="Loire Bistro" class="img-tall">
    </div>
    <div class="gallery-row full">
      <img src="design-system/images/GASTRONOMIA/loire bistro/Cópia de RBC01749.avif" alt="Loire Bistro" class="img-h">
    </div>
  </div>

  <a href="feed.html" class="next-proj">
    <span class="next-label">Acervo</span>
    <span class="next-title">Ver todos os projetos</span>
  </a>

</body>
</html>
